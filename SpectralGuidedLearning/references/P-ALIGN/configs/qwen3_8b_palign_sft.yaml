### Qwen3-8B P-ALIGN SFT (LLaMA-Factory)
### See HYPERPARAMETERS.md for paper vs assumed values.

model_name_or_path: /mnt/local/aiskylimit_new_nothing/P-ALIGN/models/Qwen3-8B
trust_remote_code: true
flash_attn: auto

stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
lora_rank: 16
lora_alpha: 16
lora_dropout: 0.05
use_rslora: false
use_dora: false

dataset: palign_qwen25_7b_sft
dataset_dir: data
template: qwen3
# non-thinking mode: prepend empty <think></think> block, matching enable_thinking=False in src/test.py
enable_thinking: false
cutoff_len: 32768
overwrite_cache: true
preprocessing_num_workers: 4
train_on_prompt: false

output_dir: output/palign-qwen3-8b-lora
logging_steps: 1
save_strategy: epoch
plot_loss: false
overwrite_output_dir: true
report_to: none
disable_tqdm: false

per_device_train_batch_size: 1
gradient_accumulation_steps: 32
num_train_epochs: 3.0
learning_rate: 5.0e-5
lr_scheduler_type: cosine
warmup_ratio: 0.1
optim: adamw_torch
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-8
weight_decay: 0.0
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
