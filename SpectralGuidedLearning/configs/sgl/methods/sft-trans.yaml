# SFT + next-step representation objective: L = L_NLL + lambda * L_trans (sgl.training.transition_loss).
# The layer defaults to round(2/3 * depth) (24 for Qwen3-8B, as in scripts/trans/).
trans_lambda: 0.3
train_variant: vanilla-trans
pipeline: [prepare, vanilla, transitions, train, eval]
stages:
  transitions:
    module: sgl.transforms.build_transitions
    creates: ${data_dir}/train-vanilla-trans.jsonl
    args:
      segmented: ${data_dir}/train-segmented.jsonl
      masked: ${data_dir}/train-vanilla.jsonl
      output: ${data_dir}/train-vanilla-trans.jsonl
      tokenizer: ${model.name}
      min-step-tokens: 8
  train:
    args:
      trans-lambda: ${trans_lambda}
      trans-lr: 2.0e-4
      trans-hidden: 1024
      trans-grad-log-interval: 50
