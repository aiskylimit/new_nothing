# r1-qwen-1.5b on the full s1K-1.1 DeepSeek-R1 traces, full fine-tuning.
# Supervised inside R1-Distill's <think> block; evaluation is the shared protocol (thinking off).
defaults:
  - ../../common/base.yaml
  - ../../common/models/r1-qwen-1.5b.yaml
  - ../../common/data/s1k.yaml
  - ../../common/train/full-ds-z2.yaml
  - ../../common/eval/palign-protocol.yaml
track: r1-qwen-1.5b-s1k
# rebuttal runs keep their scores and logs apart from results/ and logs/
results_dir: rebuttal/results
run:
  log_dir: rebuttal/logs
stages:
  train:
    args:
      # per-step loss / grad_norm / lr history (checkpoints/ is not tracked by git)
      metrics-log: rebuttal/train-metrics/${run_name}.json
