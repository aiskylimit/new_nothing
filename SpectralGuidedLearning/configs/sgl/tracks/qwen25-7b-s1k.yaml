# qwen25-7b on the full s1K-1.1 DeepSeek-R1 traces, LoRA (adapters are evaluated on the base model).
# The template has no thinking block to fill, so the trace is supervised with thinking off.
defaults:
  - ../../common/base.yaml
  - ../../common/models/qwen25-7b.yaml
  - ../../common/data/s1k.yaml
  - ../../common/train/lora-r16.yaml
  - ../../common/eval/palign-protocol.yaml
track: qwen25-7b-s1k
lora_adapter: true
stages:
  prepare:
    args:
      # steps are cut at blank lines (every "\n\n"), not at sentence ends as in the P-ALIGN tracks
      segmenter: paragraph
      enable-thinking: false
  eval:
    args:
      gpu-memory-utilization: 0.5
