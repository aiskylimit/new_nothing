# SELOT-gated (selot/gated_fit.py): a gate decides whether to steer (Gaussian-mixture posterior over D_j / D_b / D_r on
# whitened top-gate_m PCs, threshold at gate_fpr of held-out benign), Gaussian OT decides where (one map per jailbreak
# mode). No ridge field. Ablation branch 3 (GMM gate + mixture OT); branch 1: selot_gated_logistic, branch 2:
# selot_gated_single. Runtime gate: once per prompt, from the last prompt token.
method:
  name: selot_gated
  k: 5                      # transport subspace (as SELOT)
  eps: 1.0e-4
  gate: gmm                 # gmm | logistic
  mixture: true             # gmm: one OT per jailbreak component (false: one OT for all of D_j)
  gate_m: 64                # gate features: whitened top PCs (three sets weighted 1/3 each)
  max_components: 4         # gmm components of each set, chosen by BIC (gate_components: fixed = always this many)
  gate_components: bic
  gate_reg: 1.0e-2
  gate_fpr: 0.01            # held-out benign share with gate > 1/2
  gate_temperature: 1.0
  calib_frac: 0.2           # share of D_b train held out for the threshold
  beta: 100.0               # negative prior split benign : refused
  beta_r: 1.0
  seed: 0
