# Giống hệt phase1_svgd_func_keystep_k1.yaml, CHỈ đổi global_batch 32 -> 1.
# Cơ sở: literature (LoRA Without Regret - Thinking Machines; "Beware of the Batch
# Size" arXiv 2602.09492) cho thấy LoRA nhạy cảm với batch lớn hơn full fine-tune,
# và batch tối ưu tỉ lệ với quy mô dataset (dataset nhỏ ~1000 mẫu -> batch nhỏ tốt
# hơn). P-ALIGN checkpoint thật dùng train_batch_size=1, max_steps=2050 (~32x nhiều
# bước gradient hơn mình). Code xử lý per-example (backward mỗi micro-step, chỉ
# optimizer.step() mỗi global_batch) nên đổi global_batch KHÔNG tốn thêm compute/mem.
model_name: Qwen/Qwen2.5-7B-Instruct
train_file: data/train_s1k_prefixed.jsonl
out_dir: outputs/proposal_v2/phase1_svgd_func_keystep_k1_batch1

epochs: 3
lr: 5.0e-5
lora_r: 16
lora_alpha: 16
lora_dropout: 0.05
warmup_ratio: 0.1
global_batch: 1
max_grad_norm: 1.0
gradient_checkpointing: true
cutoff_len: 16384
segmentation_mode: paragraph

M: 3
p_drop: 0.1
lambda_rep: 0.01
warmup_div_epochs: 1

diversity: svgd_func
tr_off_k: 1.0
svgd_sigma: 0.0
keystep_dir: outputs/proposal_v2/keystep_s1k_prefixed_10pct

seed: 42
log_every: 20
