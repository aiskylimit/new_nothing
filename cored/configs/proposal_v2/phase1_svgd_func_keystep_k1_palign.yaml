# Giống hệt phase1_svgd_func_keystep_k1.yaml, nhưng dùng data/train_s1k_palign.jsonl
# (bản cắt CoT CHÍNH THỨC theo P-ALIGN, prefix_frac~30.7%) thay vì train_s1k_prefixed.jsonl
# (bản cắt tự tính của mình, prefix_frac~15.8% — bị nghi ngờ cắt quá tay, mất reasoning).
model_name: Qwen/Qwen2.5-7B-Instruct
train_file: data/train_s1k_palign.jsonl
out_dir: outputs/proposal_v2/phase1_svgd_func_keystep_k1_palign

epochs: 3
lr: 5.0e-5
lora_r: 16
lora_alpha: 16
lora_dropout: 0.05
warmup_ratio: 0.1
global_batch: 32
max_grad_norm: 1.0
gradient_checkpointing: true
cutoff_len: 16384
segmentation_mode: paragraph

M: 3
p_drop: 0.1
lambda_rep: 0.01
warmup_div_epochs: 1

diversity: svgd_func
tr_off_k: 1.0
svgd_sigma: 0.0
keystep_dir: outputs/proposal_v2/keystep_s1k_palign_10pct

seed: 42
log_every: 5
