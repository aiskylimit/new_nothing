[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cypher-extract"
version = "0.1.0"
description = "Schema-grounding data preparation and knowledge distillation for Text-to-Cypher"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.3.0,<=1.11.0",
    "datasets>=2.16.0,<=4.0.0",
    # DeepSpeed is required for Linux/WSL2 KD training only.
    "deepspeed>=0.15.0; sys_platform == 'linux'",
    "huggingface-hub>=0.24.0",
    "jieba>=0.42.1",
    "llamafactory @ git+https://github.com/hiyouga/LLaMA-Factory.git@f28afaf6355af515454dfb16c97d728307c93897",
    "nltk>=3.9.1",
    "numpy>=1.26",
    "omegaconf>=2.3.0",
    "peft>=0.18.0,<=0.18.1",
    "pyyaml>=6.0",
    "rouge-chinese>=1.0.3",
    "torch==2.9.1+cu128",
    "torchaudio==2.9.1+cu128",
    "transformers>=5.5.0,<=5.8.0,!=5.6.0",
    "trl>=0.18.0,<=0.24.0",
]

[project.optional-dependencies]
evaluation = [
    "neo4j>=5.20",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
kd-train = "distillation.cli:main"
prepare-llamafactory-data = "distillation.prepare_data:main"
evaluate-cypher = "cypher_evaluation.cli:main"
merge-cypher-evaluations = "cypher_evaluation.merge:main"

[tool.hatch.build.targets.wheel]
packages = [
    "src/distillation",
    "src/schema_grounding",
    "src/cypher_evaluation",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/configs",
    "/data/dataset_info.json",
    "/docs",
    "/prompts",
    "/scripts",
    "/tests",
    "/README.md",
    "/requirements.txt",
    "/requirements-distillation.txt",
    "/pyproject.toml",
]
exclude = [
    "/benchmarks",
    "/data/cypherbench_schema_grounding_full",
    "/data/cypherbench_schema_grounding_full_final",
    "/data/mind_the_query_schema_grounding_full",
    "/data/neo4j_text2cypher_schema_grounding_full",
    "/data/prepared",
    "/results",
    "/template",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
index-url = "https://pypi.org/simple"
extra-index-url = ["https://download.pytorch.org/whl/cu128"]
index-strategy = "unsafe-best-match"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
