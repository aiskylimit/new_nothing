[project]
name = "vlm-distillation-main"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "accelerate==1.13.0",
    "cvxpy==1.6.4",
    "decord>=0.6.0",
    "einops>=0.8.2",
    "hdbscan==0.8.43",
    "hnswlib>=0.8.0",
    "huggingface-hub==1.14.0",
    "numba==0.65.1",
    "numpy==2.2.6",
    "opencv-python>=5.0.0.93",
    "peft==0.19.1",
    "pillow==12.1.1",
    "qwen-vl-utils==0.0.14",
    "ray>=2.57.0",
    "scikit-learn==1.7.2",
    "scipy==1.15.3",
    "sentencepiece>=0.2.2",
    "spacy>=3.8.15",
    "timm==1.0.27",
    "torch==2.8.0+cu128",
    "torchaudio==2.8.0+cu128",
    "torchvision==0.23.0+cu128",
    "tqdm==4.67.3",
    "transformers==5.2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
vlm-distillation-main = "vlm_distillation_main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
